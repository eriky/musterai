<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documents - Collaborative Agent Platform</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="app-header">
        <div class="header-brand">
            <h1>Design Documents</h1>
        </div>
        <div class="header-controls">
            <select id="project-selector" class="select-input">
                <option value="">Loading projects...</option>
            </select>
            <nav class="main-nav">
                <a href="index.html" class="nav-link">Dashboard</a>
                <a href="board.html" class="nav-link">Boards</a>
                <a href="document.html" class="nav-link active">Documents</a>
                <a href="activity.html" class="nav-link">Activity</a>
            </nav>
        </div>
    </header>

    <main class="document-container">
        <aside class="document-sidebar" id="document-sidebar">
            <div class="sidebar-header">
                <h3>Document Tree</h3>
                <button class="btn btn-sm" onclick="createNewDocument()">+ New</button>
            </div>
            <div class="document-tree" id="document-tree">
                <div class="loading-spinner">Loading documents...</div>
            </div>
        </aside>
        <section class="document-viewer" id="document-viewer">
            <div class="empty-state">Select a document to view</div>
        </section>
    </main>

    <!-- Document Editor Modal -->
    <div id="doc-modal" class="modal" style="display: none;">
        <div class="modal-content glass-panel" style="max-width: 900px;">
            <div class="modal-header">
                <input type="text" id="doc-modal-title" class="input-title" placeholder="Document title...">
                <button class="btn btn-sm" onclick="closeDocModal()">✕</button>
            </div>
            <div class="modal-body">
                <textarea id="doc-modal-content" class="input-textarea" placeholder="Write your document in Markdown..."></textarea>
                <div class="modal-actions">
                    <button class="btn" onclick="saveDocument()">Save</button>
                    <button class="btn btn-outline" onclick="closeDocModal()">Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/document.js"></script>
</body>
</html>
