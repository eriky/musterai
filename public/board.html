<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Board - Collaborative Agent Platform</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="app-header">
        <div class="header-brand">
            <h1>Board View</h1>
        </div>
        <div class="header-controls">
            <select id="project-selector" class="select-input">
                <option value="">Loading projects...</option>
            </select>
            <select id="board-selector" class="select-input select-sm">
                <option value="">Select Board</option>
            </select>
            <nav class="main-nav">
                <a href="index.html" class="nav-link">Dashboard</a>
                <a href="board.html" class="nav-link active">Boards</a>
                <a href="document.html" class="nav-link">Documents</a>
                <a href="activity.html" class="nav-link">Activity</a>
            </nav>
        </div>
    </header>

    <main class="board-container" id="board-container">
        <div class="empty-state">Select a board to view</div>
    </main>

    <!-- Card Detail Modal -->
    <div id="card-modal" class="modal" style="display: none;">
        <div class="modal-content glass-panel">
            <div class="modal-header">
                <h2 id="modal-card-title">Card Title</h2>
                <button class="btn btn-sm" onclick="closeCardModal()">✕</button>
            </div>
            <div class="modal-body" id="modal-card-body">
                <div class="loading-spinner">Loading card details...</div>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/board.js"></script>
</body>
</html>
