<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity - Collaborative Agent Platform</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="app-header">
        <div class="header-brand">
            <h1>Activity Feed</h1>
        </div>
        <div class="header-controls">
            <select id="project-selector" class="select-input">
                <option value="">Loading projects...</option>
            </select>
            <div class="filter-group">
                <select id="filter-entity" class="select-input select-sm">
                    <option value="">All Types</option>
                    <option value="card">Cards</option>
                    <option value="document">Documents</option>
                    <option value="agent">Agents</option>
                </select>
            </div>
            <nav class="main-nav">
                <a href="index.html" class="nav-link">Dashboard</a>
                <a href="board.html" class="nav-link">Boards</a>
                <a href="document.html" class="nav-link">Documents</a>
                <a href="activity.html" class="nav-link active">Activity</a>
            </nav>
        </div>
    </header>

    <main class="activity-container">
        <section class="activity-feed" id="activity-feed">
            <div class="loading-spinner">Loading activity...</div>
        </section>
    </main>

    <script src="js/app.js"></script>
    <script src="js/activity.js"></script>
</body>
</html>
