# docker-compose.yml - Muster
version: '3.8'

services:
  muster-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: muster-platform
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - MUSTER_PORT=3000
      - MUSTER_HOST=0.0.0.0
      - MUSTER_DB_PATH=/app/data/muster.db
    volumes:
      - muster-data:/app/data

volumes:
  muster-data:
    driver: local
