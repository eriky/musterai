# docker-compose.yml - Collaborative Agent Platform (CAP)
version: '3.8'

services:
  cap-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cap-platform
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - CAP_PORT=3000
      - CAP_HOST=0.0.0.0
      - CAP_DB_PATH=/app/data/cap.db
    volumes:
      - cap-data:/app/data

volumes:
  cap-data:
    driver: local
